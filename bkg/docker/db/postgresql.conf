# bkg-supafleet PostgreSQL 18 configuration
# Mounted at /etc/postgresql/postgresql.conf

# --- Connections ---
listen_addresses = '*'
port = 5432
max_connections = 200
# Unix socket directory of the official image (also used by pg_isready and
# by clients that connect without a host, e.g. "psql -U postgres").
unix_socket_directories = '/var/run/postgresql'

# --- TLS ---
ssl = on
ssl_cert_file = '/etc/postgresql/ssl/server.crt'
ssl_key_file = '/etc/postgresql/ssl/server.key'

# --- Memory ---
shared_buffers = 256MB
effective_cache_size = 1GB
maintenance_work_mem = 64MB
work_mem = 4MB

# --- WAL ---
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10

# --- Logging ---
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_duration = off

# --- Extensions ---
shared_preload_libraries = 'pg_stat_statements,pg_cron'
pg_stat_statements.track = all
# pg_cron registers this GUC as `cron.database_name` (not `pg_cron.*`).
# Supabase init scripts run against POSTGRES_DB (onedev), so pg_cron must be
# creatable there – otherwise CREATE EXTENSION aborts initdb with ON_ERROR_STOP.
cron.database_name = 'onedev'

# --- Autovacuum ---
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# --- Performance ---
random_page_cost = 1.1
effective_io_concurrency = 200